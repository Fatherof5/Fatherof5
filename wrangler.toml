name = "father-of-5-trading"
main = "src/worker.js"
compatibility_date = "2026-11-13"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "father-of-5-trading"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[triggers]
crons = ["* * * * *"]
